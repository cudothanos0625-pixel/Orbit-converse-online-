<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Orbit</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #202b52 0%,
            #111827 45%,
            #090d16 100%
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.container {
    width: 100%;

    max-width: 430px;

    background:
        rgba(20, 27, 43, 0.97);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 18px;

    padding: 32px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.45);
}


.logo {
    text-align: center;

    margin-bottom: 25px;
}


.logo-icon {
    display: block;

    font-size: 55px;

    margin-bottom: 5px;
}


.logo h1 {
    margin: 0;

    font-size: 40px;

    background:
        linear-gradient(
            90deg,
            #5865f2,
            #8b5cf6
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}


.logo p {
    color: #9ca3af;

    font-size: 15px;

    margin-top: 8px;
}


.tabs {
    display: flex;

    gap: 8px;

    margin-bottom: 25px;
}


.tab {
    flex: 1;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #1f2937;

    color: #9ca3af;

    font-size: 15px;

    cursor: pointer;
}


.tab.active {
    background: #5865f2;

    color: white;
}


.form-group {
    margin-bottom: 18px;
}


label {
    display: block;

    margin-bottom: 7px;

    color: #d1d5db;

    font-size: 14px;

    font-weight: bold;
}


input {
    width: 100%;

    padding: 14px;

    border-radius: 9px;

    border:
        1px solid
        #374151;

    background: #111827;

    color: white;

    outline: none;

    font-size: 15px;
}


input:focus {
    border-color: #5865f2;

    box-shadow:
        0 0 0 3px
        rgba(88,101,242,.15);
}


.main-button {
    width: 100%;

    padding: 14px;

    margin-top: 5px;

    border: none;

    border-radius: 9px;

    background: #5865f2;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.main-button:hover {
    background: #4752c4;
}


.main-button:disabled {
    opacity: .6;

    cursor: not-allowed;
}


.message {
    display: none;

    margin-top: 18px;

    padding: 12px;

    border-radius: 8px;

    font-size: 14px;

    text-align: center;
}


.message.error {
    display: block;

    background:
        rgba(239,68,68,.12);

    border:
        1px solid
        rgba(239,68,68,.3);

    color: #fca5a5;
}


.message.success {
    display: block;

    background:
        rgba(34,197,94,.12);

    border:
        1px solid
        rgba(34,197,94,.3);

    color: #86efac;
}


.hidden {
    display: none;
}


@media (max-width: 480px) {

    .container {
        padding:
            25px 20px;
    }

    .logo h1 {
        font-size: 34px;
    }

}

</style>

</head>


<body>


<main class="container">


    <div class="logo">

        <span class="logo-icon">
            🌐
        </span>

        <h1>
            Orbit
        </h1>

        <p>
            Seu espaço para conversar
            e criar comunidades.
        </p>

    </div>


    <div class="tabs">

        <button
            id="loginTab"
            class="tab active"
            onclick="showLogin()"
        >
            Entrar
        </button>


        <button
            id="registerTab"
            class="tab"
            onclick="showRegister()"
        >
            Criar conta
        </button>

    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <form
        id="loginForm"
        onsubmit="login(event)"
    >

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Senha
            </label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            id="loginButton"
            class="main-button"
            type="submit"
        >
            Entrar no Orbit
        </button>

    </form>


    <!-- =========================
         CADASTRO
    ========================== -->

    <form
        id="registerForm"
        class="hidden"
        onsubmit="register(event)"
    >

        <div class="form-group">

            <label>
                Nome de usuário
            </label>

            <input
                id="username"
                type="text"
                placeholder="Ex: OrbitPlayer"
                minlength="3"
                maxlength="20"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="registerEmail"
                type="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Senha
            </label>

            <input
                id="registerPassword"
                type="password"
                placeholder="Crie uma senha"
                minlength="6"
                autocomplete="new-password"
                required
            >

        </div>


        <button
            id="registerButton"
            class="main-button"
            type="submit"
        >
            Criar minha conta
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


</main>


<script>

/* =========================================================
   CONFIGURAÇÃO DO SUPABASE
========================================================= */

/*
   ⚠️ COLOQUE AQUI OS DADOS DO SEU PROJETO.

   Você encontra os dois em:

   Supabase
   → Settings
   → API

   URL:
   Project URL

   KEY:
   Publishable key

   NÃO coloque aqui uma Secret key
   ou Service Role key.
*/


const SUPABASE_URL =
    https://vexfbfcnkstqrpqyznco.supabase.co/rest/v1/


const SUPABASE_KEY =
    sb_publishable_TbCwsM7sHImjC4xzZS6xng_EGhJmZKf


/* =========================================================
   CRIAR CLIENTE SUPABASE
========================================================= */

let supabaseClient = null;


if (
    SUPABASE_URL.startsWith("http") &&
    SUPABASE_KEY &&
    !SUPABASE_URL.includes("COLE_AQUI") &&
    !SUPABASE_KEY.includes("COLE_AQUI")
) {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

}


/* =========================================================
   AO ABRIR O ORBIT
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    checkSession
);


async function checkSession() {

    if (!supabaseClient) {

        showMessage(
            "Configure primeiro a URL e a chave do Supabase.",
            "error"
        );

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        return;
    }


    /*
       Se já estiver logado,
       vai direto para o início.
    */

    if (data.session) {

        window.location.href =
            "inicio.html";

    }

}


/* =========================================================
   MOSTRAR LOGIN
========================================================= */

function showLogin() {

    document
        .getElementById("loginForm")
        .classList
        .remove("hidden");


    document
        .getElementById("registerForm")
        .classList
        .add("hidden");


    document
        .getElementById("loginTab")
        .classList
        .add("active");


    document
        .getElementById("registerTab")
        .classList
        .remove("active");


    clearMessage();

}


/* =========================================================
   MOSTRAR CADASTRO
========================================================= */

function showRegister() {

    document
        .getElementById("loginForm")
        .classList
        .add("hidden");


    document
        .getElementById("registerForm")
        .classList
        .remove("hidden");


    document
        .getElementById("loginTab")
        .classList
        .remove("active");


    document
        .getElementById("registerTab")
        .classList
        .add("active");


    clearMessage();

}


/* =========================================================
   LOGIN REAL
========================================================= */

async function login(event) {

    event.preventDefault();


    if (!supabaseClient) {

        showMessage(
            "O Supabase ainda não foi configurado.",
            "error"
        );

        return;
    }


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    if (!email || !password) {

        showMessage(
            "Preencha o email e a senha.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "Entrando...";


    /*
       LOGIN REAL DO SUPABASE
    */

    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);


        /*
           Conta inexistente,
           senha errada ou outro
           problema de autenticação.
        */

        showMessage(
            getAuthError(error),
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Entrar no Orbit";


        return;
    }


    if (!data.session) {

        showMessage(
            "Não foi possível iniciar a sessão.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Entrar no Orbit";


        return;
    }


    showMessage(
        "Login realizado! Entrando no Orbit...",
        "success"
    );


    /*
       Pequeno tempo para mostrar
       a mensagem e depois abrir
       o início.
    */

    setTimeout(
        () => {

            window.location.href =
                "inicio.html";

        },
        500
    );

}


/* =========================================================
   CADASTRO REAL
========================================================= */

async function register(event) {

    event.preventDefault();


    if (!supabaseClient) {

        showMessage(
            "O Supabase ainda não foi configurado.",
            "error"
        );

        return;
    }


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("registerPassword")
            .value;


    if (
        username.length < 3
    ) {

        showMessage(
            "O nome de usuário precisa ter pelo menos 3 caracteres.",
            "error"
        );

        return;
    }


    if (
        password.length < 6
    ) {

        showMessage(
            "A senha precisa ter pelo menos 6 caracteres.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "registerButton"
        );


    button.disabled = true;

    button.textContent =
        "Criando conta...";


    /*
       Primeiro criamos a conta
       no Supabase Auth.
    */

    const {
        data,
        error
    } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        showMessage(
            getAuthError(error),
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Criar minha conta";


        return;
    }


    /*
       Se o usuário foi criado,
       criamos o perfil.
    */

    if (data.user) {

        const {
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .insert({

                    id:
                        data.user.id,

                    username:
                        username

                });


        if (profileError) {

            console.error(
                profileError
            );

            showMessage(
                "A conta foi criada, mas houve um problema ao criar o perfil.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Criar minha conta";


            return;
        }

    }


    /*
       Dependendo das configurações
       do Supabase, o email pode
       precisar ser confirmado.
    */

    if (
        data.session
    ) {

        showMessage(
            "Conta criada! Entrando no Orbit...",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "inicio.html";

            },
            700
        );

    } else {

        showMessage(
            "Conta criada! Verifique seu email para confirmar a conta.",
            "success"
        );


        button.disabled = false;

        button.textContent =
            "Criar minha conta";

    }

}


/* =========================================================
   ERROS DO SUPABASE
========================================================= */

function getAuthError(error) {

    const message =
        (
            error?.message ||
            ""
        ).toLowerCase();


    if (
        message.includes(
            "invalid login credentials"
        )
    ) {

        return (
            "Email ou senha incorretos."
        );

    }


    if (
        message.includes(
            "email not confirmed"
        )
    ) {

        return (
            "Seu email ainda não foi confirmado."
        );

    }


    if (
        message.includes(
            "user already registered"
        )
    ) {

        return (
            "Esse email já possui uma conta."
        );

    }


    if (
        message.includes(
            "password"
        ) &&
        message.includes(
            "6"
        )
    ) {

        return (
            "A senha precisa ter pelo menos 6 caracteres."
        );

    }


    if (
        message.includes(
            "email"
        )
    ) {

        return (
            "Verifique se o email foi digitado corretamente."
        );

    }


    return (
        "Não foi possível realizar a operação. Verifique seus dados e tente novamente."
    );

}


/* =========================================================
   MENSAGENS
========================================================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;

}


function clearMessage() {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "";


    message.className =
        "message";

}

</script>

</body>

</html>
